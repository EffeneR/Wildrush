[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers
markers =
    live: tests that run a real uvicorn server, allocator agent subprocess and dummy game servers
filterwarnings =
    # starlette 1.7 prefers the "httpx2" package for its TestClient; httpx 0.28 (pinned) works.
    ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning
